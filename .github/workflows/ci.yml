name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint
      - name: Validate Conventional Commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build production container
        run: docker build --tag poker-express:ci .

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build Playwright image
        run: docker build --target e2e --tag poker-express:e2e .
      - name: Run multi-user journey
        run: |
          mkdir -p playwright-report test-results
          docker run --rm --env CI=true \
            --volume "$PWD/playwright-report:/app/playwright-report" \
            --volume "$PWD/test-results:/app/test-results" \
            poker-express:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Compose files
        run: |
          cp .env.sample .env
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker-compose-dev.yaml --profile dev --profile tools --profile e2e config --quiet
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Validate Helm chart
        run: |
          helm lint charts/poker-express --strict
          helm template poker-express charts/poker-express \
            --set persistence.storageClass=- \
            --set persistence.volumeName=poker-express-pv >/dev/null
          helm template poker-express charts/poker-express \
            --set podDisruptionBudget.enabled=true >/dev/null
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false
      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate
