name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker tools image
        run: docker compose --profile tools build poker-express-tools
      - name: Typecheck
        run: docker compose --profile tools run --rm poker-express-tools npm run typecheck
      - name: Lint
        run: docker compose --profile tools run --rm poker-express-tools npm run lint
      - name: Unit, API, WebSocket and React tests
        run: docker compose --profile tools run --rm poker-express-tools npm test
      - name: Build production image
        run: docker compose build poker-express

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Playwright image
        run: docker compose --profile e2e build poker-express-e2e
      - name: Run multi-user journey
        run: docker compose --profile e2e run --rm poker-express-e2e
