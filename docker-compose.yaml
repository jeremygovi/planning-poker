services:
  poker-express:
    image: ${DOCKER_IMAGE:-jeremygovi/planning-poker}:${DOCKER_TAG:-latest}
    pull_policy: always
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
